<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURORA</title>
<style>
/* The laptop's screen: a fake Windows desktop with one app, Mind Upload, dead center. Opening it starts the upload on the
   wall (projector.html). This window keeps the keyboard the whole game: every key is sent to the wall through the hub,
   so nobody ever has to click the wall. */
:root { --g: #4dff88; --r: #ff3344; --tb: 48px; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; user-select: none; cursor: default; background: #03060c; color: #fff;
  font: 12px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
.mono { font-family: Consolas, "Cascadia Mono", monospace; }

/* wallpaper: a slow aurora over a night sky */
#wall { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#060c18, #02040a 70%); }
#wall i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: drift 18s ease-in-out infinite alternate; }
#wall i:nth-child(1) { left: -10%; top: -20%; width: 70%; height: 55%; background: #1f9e5c; }
#wall i:nth-child(2) { right: -15%; top: -10%; width: 60%; height: 45%; background: #1b6f9e; animation-duration: 23s; }
#wall i:nth-child(3) { left: 20%; bottom: -30%; width: 70%; height: 50%; background: #3c2a8a; animation-duration: 27s; opacity: .4; }
@keyframes drift { to { transform: translate(6%, 8%) scale(1.15); } }

/* the one desktop icon, big and dead center */
.icon { position: absolute; left: 50%; top: calc(50% - var(--tb) / 2); translate: -50% -50%; width: 150px; padding: 10px 4px 12px;
  border: 1px solid transparent; border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  font-size: 18px; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
.icon[hidden] { display: none; }
.icon:hover { background: rgba(255,255,255,.08); }
.icon.sel { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.25); }
.icon svg { width: 96px; height: 96px; }

/* taskbar */
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tb); z-index: 50; display: flex; align-items: center; justify-content: center;
  background: rgba(32,32,32,.82); backdrop-filter: blur(30px) saturate(1.4); border-top: 1px solid rgba(255,255,255,.08); }
#bar .b { position: relative; width: 40px; height: 40px; margin: 0 2px; border-radius: 4px; display: grid; place-items: center; }
#bar .b svg { width: 24px; height: 24px; }
#bar .b::after { content: ""; position: absolute; bottom: 2px; left: 50%; translate: -50%; width: 16px; height: 3px; border-radius: 2px;
  background: #4cc2ff; display: none; }
#bar .b.open::after { display: block; }
#bar #appBtn:not(.open) { display: none; }
#tray { position: absolute; right: 8px; top: 0; bottom: 0; display: flex; align-items: center; gap: 14px; padding-right: 6px; }
#tray svg { width: 16px; height: 16px; }
#clock { text-align: right; line-height: 1.35; }

/* the app window, Windows 11 dark style. No minimize / maximize / close: it can't get lost */
#win { position: fixed; z-index: 40; width: min(620px, 92vw); display: flex; flex-direction: column; border-radius: 8px; overflow: hidden;
  background: #0b1210; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 20px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4); }
#win[hidden] { display: none; }
.tbar { height: 32px; flex: none; display: flex; align-items: center; gap: 8px; padding-left: 10px; background: #202020; }
.tbar svg { width: 16px; height: 16px; }
#app { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 2.6vh 2.4vw 3vh; overflow: hidden; color: var(--g);
  background: radial-gradient(ellipse at 50% 0%, rgba(77,255,136,.1), transparent 70%), #07100c; }
#app::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
#app h1 { font: 700 2.4vh Consolas, monospace; letter-spacing: .4em; text-shadow: 0 0 10px rgba(77,255,136,.6); }
#app [hidden] { display: none !important; }

/* the loading screen: plays while the wall shows the upload, then turns into the binary key */
#load { display: flex; flex-direction: column; align-items: center; gap: 2.4vh; width: 100%; padding: 8vh 0; }
#lbar { width: 80%; height: 2.6vh; padding: 3px; border: 2px solid var(--g); }
#lbar i { display: block; height: 100%; width: 0; background: var(--g); box-shadow: 0 0 12px var(--g); }
#lpct { font: 700 4.4vh Consolas, monospace; color: #fff; }
#llog { width: 80%; height: 10vh; font: 1.8vh Consolas, monospace; color: rgba(77,255,136,.7); white-space: pre; }
#load.fail { color: var(--r); }
#load.fail h1 { text-shadow: 0 0 12px rgba(255,51,68,.7); animation: blink .35s steps(1) infinite; }
#load.fail #lbar { border-color: var(--r); }
#load.fail #lbar i { background: var(--r); box-shadow: 0 0 12px var(--r); }
#load.fail #lpct, #load.fail #llog { color: var(--r); }
@keyframes blink { 50% { opacity: .25; } }

/* a printed lookup table, "0101 = 5": plain text, no boxes, so nothing looks like a button */
#rows { margin-top: 1.6vh; }
.row { display: flex; align-items: center; gap: 2.4vh; height: 4.8vh; font: 700 3.6vh Consolas, monospace; }
.row span { letter-spacing: .25em; }
.row i { font-style: normal; color: rgba(77,255,136,.55); }
.row u { text-decoration: none; font-weight: 400; color: rgba(255,255,255,.4); }
.row b { min-width: 1ch; color: #fff; opacity: 0; }
#rows .row { opacity: 0; transform: translateX(-14px); }
#rows .row.in { opacity: 1; transform: none; transition: opacity .12s, transform .3s cubic-bezier(.2,1.4,.4,1); }
.row.lock i { color: rgba(77,255,136,.28); }
.row.lock i.on { color: var(--g); text-shadow: 0 0 12px rgba(77,255,136,.7); animation: lit .45s ease-out; }
.row.lock b { opacity: 1; animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
@keyframes lit { from { color: #fff; text-shadow: 0 0 24px #fff; } }
@keyframes pop { from { transform: scale(2); color: var(--g); text-shadow: 0 0 20px var(--g); } }
#beam { position: absolute; left: 0; right: 0; height: 2px; top: 0; opacity: 0; pointer-events: none;
  background: #fff; box-shadow: 0 0 10px 2px var(--g), 0 0 40px 8px rgba(77,255,136,.4); }

/* the password boxes: the same 4 digits the wall shows, so players see what to type */
#pw { margin-top: 2.4vh; display: flex; flex-direction: column; align-items: center; gap: 1.2vh;
  font: 700 2.2vh Consolas, monospace; letter-spacing: .12em; color: #fff; }
#boxes { display: flex; gap: 1.4vh; }
#boxes b { width: 6vh; height: 7.2vh; display: grid; place-items: center; border: 2px solid rgba(77,255,136,.45);
  font: 700 4.4vh Consolas, monospace; color: #fff; }
#boxes b.cur { border-color: var(--g); box-shadow: 0 0 14px rgba(77,255,136,.5); animation: blink 1s steps(1) infinite; }
#boxes b.ok { border-color: var(--g); color: var(--g); background: rgba(77,255,136,.12); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bk" viewBox="0 0 48 48">
    <rect x="3" y="7" width="42" height="34" rx="6" fill="#0b2418" stroke="#4dff88" stroke-width="2"/>
    <text x="24" y="29" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#4dff88">0101</text>
  </symbol>
</svg>

<div id="wall"><i></i><i></i><i></i></div>

<div class="icon" id="icon"><svg><use href="#bk"/></svg>Mind Upload</div>

<div id="win" hidden>
  <div class="tbar"><svg><use href="#bk"/></svg><span>Mind Upload</span></div>
  <div id="app">
    <div id="load">
      <h1>UPLOADING MIND</h1>
      <div id="lbar"><i></i></div>
      <div id="lpct">0%</div>
      <pre id="llog"></pre>
    </div>
    <div id="key" hidden>
      <h1>BINARY KEY</h1>
      <div id="rows"></div>
      <div id="pw"><div>Type the right password</div><div id="boxes"></div></div>
    </div>
    <div id="beam"></div>
  </div>
</div>

<div id="bar">
  <div class="b"><svg viewBox="0 0 24 24"><g fill="#4cc2ff"><rect x="2" y="2" width="9.5" height="9.5" rx="1"/><rect x="12.5" y="2" width="9.5" height="9.5" rx="1"/>
    <rect x="2" y="12.5" width="9.5" height="9.5" rx="1"/><rect x="12.5" y="12.5" width="9.5" height="9.5" rx="1"/></g></svg></div>
  <div class="b"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg></div>
  <div class="b"><svg viewBox="0 0 24 24"><path d="M2 6.5A1.5 1.5 0 0 1 3.5 5H9l2 2h9.5A1.5 1.5 0 0 1 22 8.5V18a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 18Z" fill="#f4c542"/></svg></div>
  <div class="b" id="appBtn"><svg><use href="#bk"/></svg></div>
  <div id="tray">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="#fff"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 9h4l5-4v14l-5-4H3Z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
    <div id="clock"></div>
  </div>
</div>

<script>
const CFG = {
  VOLUME: 0.5,
  ROW_MS: 110,         // gap between rows as the binary key reveals them
  LOAD_MAX: 60000,     // no word from the wall for this long (its laptop or the hub is down): show the key anyway
};
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const win = $('#win'), icon = $('#icon'), appBtn = $('#appBtn');

// ===== Sound: tiny synthesized ticks =====
const AC = new AudioContext(), master = AC.createGain();
master.gain.value = CFG.VOLUME; master.connect(AC.destination);
addEventListener('pointerdown', () => AC.resume());
function tone(type, f0, f1, dur, vol, delay = 0) {
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
}
const sfx = {
  open() { tone('sine', 420, 900, .18, .12); },
  tick() { tone('square', 2200, 1300, .05, .05); },
  done() { tone('sine', 1320, 0, .25, .1); tone('sine', 1760, 0, .35, .08, .08); },
  fail() { tone('sawtooth', 300, 60, .6, .12); },
};

// ===== Binary Key: the rows 0-9, revealed with a scan beam =====
$('#rows').innerHTML = Array.from({ length: 10 }, (_, d) =>
  `<div class="row"><span>${[...d.toString(2).padStart(4, '0')].map(b => `<i class="${b === '1' ? 'on' : ''}">0</i>`).join('')}</span><u>=</u><b>${d}</b></div>`).join('');
const rows = [...$('#rows').children];
async function lockRow(r) {                      // the bits scramble, then lock: lit cells flash and the digit pops
  r.classList.add('in');
  const cells = [...r.querySelectorAll('i')];
  for (let k = 0; k < 6; k++) { cells.forEach(c => c.textContent = Math.random() < .5 ? '0' : '1'); await wait(40); }
  cells.forEach(c => c.textContent = c.classList.contains('on') ? '1' : '0');
  r.classList.add('lock'); sfx.tick();
}
async function reveal() {
  const list = $('#rows');
  await wait(220);
  const y0 = list.offsetTop + 'px', y1 = list.offsetTop + list.offsetHeight + 'px';   // the beam reaches each row as it slides in
  $('#beam').animate([{ top: y0, opacity: 1 }, { top: y1, opacity: 1, offset: .92 }, { top: y1, opacity: 0 }], rows.length * CFG.ROW_MS / .92);
  for (const r of rows) { lockRow(r); await wait(CFG.ROW_MS); }   // not awaited: the rows overlap in a cascade
  await wait(450);
  sfx.done();
}
function boxes(entry = '', ok = false) {         // what's typed so far, mirrored from the wall
  const html = [0, 1, 2, 3].map(i => `<b class="${ok ? 'ok' : i === entry.length ? 'cur' : ''}">${entry[i] ?? ''}</b>`).join('');
  if ($('#boxes').innerHTML !== html) $('#boxes').innerHTML = html;
}
boxes();

// ===== The window: opening it starts the upload on the wall. Loading screen first, then the key =====
// phase: closed | load | key. The wall reports its mode every second (and on every digit), see onWall()
let phase = 'closed', failed = false, wallP = 0;   // wallP: the wall's upload %, so both bars move together
const LOG = ['scanning brain', 'mapping memories', 'copying personality', 'compressing dreams', 'uploading to AURORA'];
async function openWin() {
  if (phase !== 'closed') return;
  phase = 'load'; win.hidden = false; icon.hidden = true;
  win.style.left = (innerWidth - win.offsetWidth) / 2 + 'px';
  win.style.top = Math.max(0, (innerHeight - 48 - win.offsetHeight) / 2) + 'px';
  appBtn.classList.add('open'); sfx.open();
  send({ t: 'evt', e: 'p1start' });              // the run clock starts here
  toWall({ a: 'start' });                        // the wall plays its upload
  win.animate([{ transform: 'scale(.9)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 200, easing: 'cubic-bezier(.1,.9,.2,1)' });
  const t0 = performance.now(), log = $('#llog');
  let shown = 0;
  while (phase === 'load' && performance.now() - t0 < CFG.LOAD_MAX) {
    if (!failed) {
      const p = Math.floor(wallP);
      $('#lbar i').style.width = p + '%'; $('#lpct').textContent = p + '%';
      const n = Math.min(LOG.length, Math.floor(p / 97 * LOG.length) + 1);
      if (n > shown) { shown = n; log.textContent = LOG.slice(0, n).map(l => `> ${l}...`).join('\n'); sfx.tick(); }
    }
    await wait(100);
  }
  showKey();
}
function fail() {                                // the wall hit 97% and Aurora fought back
  if (failed) return;
  failed = true; sfx.fail();
  $('#load').classList.add('fail');
  $('#load h1').textContent = 'UPLOAD FAILED';
  $('#llog').textContent = '> something is blocking the upload\n> LOOK AT THE WALL';
}
function showKey() {
  if (phase === 'key') return;
  phase = 'key'; $('#load').hidden = true; $('#key').hidden = false;
  win.style.top = Math.max(0, (innerHeight - 48 - win.offsetHeight) / 2) + 'px';
  reveal();
}
icon.addEventListener('click', openWin);         // one click opens it: not everyone double-clicks
addEventListener('pointerdown', e => icon.classList.toggle('sel', !!e.target.closest('#icon')));

const FAIL = ['fight', 'rain', 'dark'], KEY = ['crt', 'input', 'check', 'done', 'net', 'atk', 'surge', 'final'];
function onWall({ mode, entry, p }) {
  if (p != null) wallP = p;
  if (mode !== 'idle' && phase === 'closed') openWin();   // this page reloaded mid-game: back to where the wall is
  if (phase === 'load' && mode === 'idle') toWall({ a: 'start' });   // the wall (re)loaded after the first one
  if (FAIL.includes(mode)) fail();
  if (KEY.includes(mode)) showKey();
  boxes(entry, ['done', 'net', 'atk', 'surge', 'final'].includes(mode));
}

const clock = () => $('#clock').innerHTML = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '<br>' + new Date().toLocaleDateString();
clock(); setInterval(clock, 5000);
addEventListener('contextmenu', e => e.preventDefault());   // no browser menu: it would give the fake away
addEventListener('dragstart', e => e.preventDefault());

// ===== Keys: this window keeps the keyboard; every plain key goes to the wall (digits, the finale's SPACE/Q/E).
// Every browser shortcut is blocked (players mashing with Ctrl held kept opening History with Ctrl+H; F5 reloads, F7
// asks about caret browsing). Chrome won't let a page block Ctrl+W/T/N, so the game never asks for Ctrl.
// Staff: Ctrl+Alt+R reloads this screen. The wall's reset (its Ctrl+Alt+R or the GM panel's RESET) reaches this page
// through the hub, so one reset clears both screens =====
const relay = (a, e) => toWall({ a, v: { key: e.key, code: e.code, rep: e.repeat } });
addEventListener('keydown', e => {
  e.preventDefault();
  if (e.ctrlKey && e.altKey) { if (e.code === 'KeyR') location.reload(); return; }
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  relay('kd', e);
});
addEventListener('keyup', e => { e.preventDefault(); relay('ku', e); });   // keyup too: Alt alone opens the menu on release

// ponytail: scans .1-.254 of one /24 network, enough for a booth router (same search as projector.html)
async function findHub() {
  const q = new URLSearchParams(location.search), net = q.get('net') || '192.168.0';
  if (q.get('hub')) return q.get('hub');
  const ping = (ip, ms) => fetch(`http://${ip}:3000/ping`, { signal: AbortSignal.timeout(ms) })
    .then(r => r.text()).then(t => t === 'nexus-hub' ? ip : Promise.reject());
  for (;;) {
    let saved; try { saved = localStorage.getItem('nexus-hub'); } catch {}
    const ip = await Promise.any(['localhost', saved].filter(Boolean).map(ip => ping(ip, 4000)))   // 4 s: on slow Wi-Fi a 1 s miss set off a 254-address scan that slowed every laptop
      .catch(() => Promise.any(Array.from({ length: 254 }, (_, i) => ping(`${net}.${i + 1}`, 4000))))
      .catch(() => null);
    if (ip) { try { localStorage.setItem('nexus-hub', ip); } catch {} return ip; }
    await wait(2000);
  }
}
// the wall runs on this laptop: messages go straight to it through server.js, no hub needed. Posted one at a time,
// so keys never arrive out of order
let linkQ = Promise.resolve();
const toWall = m => linkQ = linkQ.then(() => fetch('/link?to=wall', { method: 'POST', body: JSON.stringify(m) })).catch(() => {});
new EventSource('/link?id=desk').onmessage = e => { const m = JSON.parse(e.data);
  if (m.a === 'wall') onWall(m.v);
  if (m.a === 'reset') location.reload(); };     // the wall's Ctrl+Alt+R

let hubWs;
const send = m => hubWs?.readyState === 1 && hubWs.send(JSON.stringify(m));
async function hub() {
  const ws = hubWs = new WebSocket('ws://' + await findHub() + ':3000/ws');
  ws.onopen = () => {
    ws.send(JSON.stringify({ t: 'hello', id: 'desk1', role: 'page' }));
    if (window.TX) return;                       // from the hub, shared with the projector: the GM panel's INCOMING
    window.TX = 1;                               // TRANSMISSION, and the team's TIME LEFT
    for (const f of ['transmission.js', 'runclock.js']) {
      const s = document.createElement('script'); s.src = ws.url.replace(/^ws(.*)\/ws$/, `http$1/${f}?`) + Date.now(); s.dataset.room = 1;
      document.head.append(s);
    }
  };
  ws.onclose = () => setTimeout(hub, 2000);
  ws.onmessage = e => { const m = JSON.parse(e.data);
    if (m.t === 'cmd' && m.a === 'key' && m.v === 'KeyR') location.reload();
    if (m.t === 'cmd' && m.a === 'msg') window.transmit?.(m.v);
    if (m.t === 'run') window.RUN = m; };         // runclock.js reads it
}
hub();
</script>
</body>
</html>
