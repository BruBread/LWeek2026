<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURORA</title>
<style>
/* The laptop's screen: a fake Windows desktop with one app, Binary Key. The projector (projector.html) sits BELOW this
   display in Windows' display arrangement, so the mouse reaches the wall by going off the bottom edge. */
:root { --g: #4dff88; --tb: 48px; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; user-select: none; cursor: default; background: #03060c; color: #fff;
  font: 12px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
.mono { font-family: Consolas, "Cascadia Mono", monospace; }

/* wallpaper: a slow aurora over a night sky, and the one clue */
#wall { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#060c18, #02040a 70%); }
#wall i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: drift 18s ease-in-out infinite alternate; }
#wall i:nth-child(1) { left: -10%; top: -20%; width: 70%; height: 55%; background: #1f9e5c; }
#wall i:nth-child(2) { right: -15%; top: -10%; width: 60%; height: 45%; background: #1b6f9e; animation-duration: 23s; }
#wall i:nth-child(3) { left: 20%; bottom: -30%; width: 70%; height: 50%; background: #3c2a8a; animation-duration: 27s; opacity: .4; }
@keyframes drift { to { transform: translate(6%, 8%) scale(1.15); } }
#motto { position: absolute; left: 50%; top: 42%; translate: -50% -50%; display: flex; flex-direction: column; align-items: center; gap: 5vh; }
#motto div { padding: 2.2vh 3.4vw; border: 2px dashed rgba(255,255,255,.55); border-radius: 10px;
  font: 300 5vw "Segoe UI Variable Display", "Segoe UI Light", "Segoe UI", sans-serif; letter-spacing: .02em; white-space: nowrap;
  text-shadow: 0 2px 24px rgba(0,0,0,.6); }
#motto svg { width: 6vw; height: 9vw; filter: drop-shadow(0 4px 14px rgba(0,0,0,.7)); animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { translate: 0 3vh; } }

/* stuck hint, sent by projector.html CFG.HINT_AFTER s into the run if the mask isn't found: Aurora glitches the wallpaper */
#motto div { position: relative; }
#motto.stuck div { text-transform: uppercase; font: 700 4.4vw Consolas, "Cascadia Mono", monospace; color: var(--g); border-color: var(--g); background: rgba(0,20,10,.6);
  text-shadow: 0 0 18px rgba(77,255,136,.7); box-shadow: 0 0 30px rgba(77,255,136,.3), inset 0 0 30px rgba(77,255,136,.15); }
#motto.stuck svg { animation-duration: .7s; }
#motto.stuck svg path { fill: var(--g); }
#motto.burst div::before, #motto.burst div::after { content: attr(data-text); position: absolute; inset: 0; padding: inherit; }
#motto.burst div::before { color: #ff2a4a; animation: gA .2s steps(2) infinite; }
#motto.burst div::after  { color: #0ff; animation: gB .26s steps(2) infinite; }
@keyframes gA { 0% { clip-path: inset(10% 0 70% 0); transform: translate(-9px,-2px) }
                50% { clip-path: inset(45% 0 30% 0); transform: translate(8px,1px) }
                100% { clip-path: inset(80% 0 4% 0); transform: translate(-4px,2px) } }
@keyframes gB { 0% { clip-path: inset(60% 0 20% 0); transform: translate(9px,2px) }
                50% { clip-path: inset(5% 0 80% 0); transform: translate(-6px,-1px) }
                100% { clip-path: inset(30% 0 50% 0); transform: translate(5px,0) } }
body.glitch #wall { animation: tear .12s steps(2) infinite; }
@keyframes tear { from { transform: translate(-1.5vw, 0) skewX(5deg); filter: hue-rotate(90deg) contrast(1.6); }
                  to { transform: translate(1vw, .6vh); filter: invert(1) hue-rotate(180deg); } }
body.glitch::after { content: ""; position: fixed; inset: 0; z-index: 45; pointer-events: none;
  background: repeating-linear-gradient(rgba(77,255,136,.14) 0 2px, transparent 2px 5px); animation: tear .09s steps(2) infinite; }

/* desktop icon */
.icon { position: absolute; left: 8px; top: 8px; width: 84px; padding: 6px 2px 8px; border: 1px solid transparent; border-radius: 4px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
.icon:hover { background: rgba(255,255,255,.08); }
.icon.sel { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.25); }
.icon svg { width: 48px; height: 48px; }

/* taskbar */
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tb); z-index: 50; display: flex; align-items: center; justify-content: center;
  background: rgba(32,32,32,.82); backdrop-filter: blur(30px) saturate(1.4); border-top: 1px solid rgba(255,255,255,.08); }
#bar .b { position: relative; width: 40px; height: 40px; margin: 0 2px; border-radius: 4px; display: grid; place-items: center; }
#bar .b:hover { background: rgba(255,255,255,.08); }
#bar .b svg { width: 24px; height: 24px; }
#bar .b::after { content: ""; position: absolute; bottom: 2px; left: 50%; translate: -50%; width: 6px; height: 3px; border-radius: 2px;
  background: #aaa; display: none; }
#bar .b.open::after { display: block; }
#bar .b.open.front::after { width: 16px; background: #4cc2ff; }
#bar #appBtn:not(.open) { display: none; }
#tray { position: absolute; right: 8px; top: 0; bottom: 0; display: flex; align-items: center; gap: 14px; padding-right: 6px; }
#tray svg { width: 16px; height: 16px; }
#clock { text-align: right; line-height: 1.35; }

/* the app window, Windows 11 dark style */
#win { position: fixed; z-index: 40; width: min(620px, 92vw); display: flex; flex-direction: column; border-radius: 8px; overflow: hidden;
  background: #0b1210; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 20px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4); }
#win[hidden] { display: none; }
#win.max { left: 0 !important; top: 0 !important; width: 100vw; height: calc(100vh - var(--tb)); border-radius: 0; }
.tbar { height: 32px; flex: none; display: flex; align-items: center; gap: 8px; padding-left: 10px; background: #202020; }
.tbar svg { width: 16px; height: 16px; }
.tbar span { flex: 1; }
.tbar b { width: 46px; height: 32px; display: grid; place-items: center; font: 10px "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
.tbar b:hover { background: rgba(255,255,255,.08); }
.tbar b.x:hover { background: #c42b1c; }
#app { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 2.6vh 2.4vw 3vh; overflow: hidden; color: var(--g);
  background: radial-gradient(ellipse at 50% 0%, rgba(77,255,136,.1), transparent 70%), #07100c; }
#app::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
#app h1 { font: 700 2.4vh Consolas, monospace; letter-spacing: .4em; text-shadow: 0 0 10px rgba(77,255,136,.6); }
/* a printed lookup table, "0101 = 5": plain text, no boxes, so nothing looks like a button */
#rows { margin-top: 1.6vh; }
.row { display: flex; align-items: center; gap: 2.4vh; height: 5.2vh; font: 700 3.8vh Consolas, monospace; }
.row span { letter-spacing: .25em; }
.row i { font-style: normal; color: rgba(77,255,136,.55); }
.row u { text-decoration: none; font-weight: 400; color: rgba(255,255,255,.4); }
.row b { min-width: 1ch; color: #fff; opacity: 0; }
#rows .row { opacity: 0; transform: translateX(-14px); }
#rows .row.in { opacity: 1; transform: none; transition: opacity .12s, transform .3s cubic-bezier(.2,1.4,.4,1); }
.row.lock i { color: rgba(77,255,136,.28); }
.row.lock i.on { color: var(--g); text-shadow: 0 0 12px rgba(77,255,136,.7); animation: lit .45s ease-out; }
.row.lock b { opacity: 1; animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
@keyframes lit { from { color: #fff; text-shadow: 0 0 24px #fff; } }
@keyframes pop { from { transform: scale(2); color: var(--g); text-shadow: 0 0 20px var(--g); } }
#beam { position: absolute; left: 0; right: 0; height: 2px; top: 0; opacity: 0; pointer-events: none;
  background: #fff; box-shadow: 0 0 10px 2px var(--g), 0 0 40px 8px rgba(77,255,136,.4); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bk" viewBox="0 0 48 48">
    <rect x="3" y="7" width="42" height="34" rx="6" fill="#0b2418" stroke="#4dff88" stroke-width="2"/>
    <text x="24" y="29" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#4dff88">0101</text>
  </symbol>
</svg>

<div id="wall"><i></i><i></i><i></i>
  <div id="motto">
    <div data-text="Move the mouse down">Move the mouse down</div>
    <!-- a mouse pointer, turned to point straight down -->
    <svg viewBox="0 -1 16 23"><path transform="rotate(202 6 9.5)" d="M0 0V16L4 12.2 6.8 18.6 9.4 17.5 6.6 11.2H11.6Z"
      fill="#fff" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/></svg>
  </div>
</div>

<div class="icon" id="icon"><svg><use href="#bk"/></svg>Binary Key</div>

<div id="win" hidden>
  <div class="tbar"><svg><use href="#bk"/></svg><span>Binary Key</span><b data-a="min">&#xE921;</b><b data-a="max">&#xE922;</b><b data-a="close" class="x">&#xE8BB;</b></div>
  <div id="app">
    <h1>BINARY KEY</h1>
    <div id="rows"></div>
    <div id="beam"></div>
  </div>
</div>

<div id="bar">
  <div class="b"><svg viewBox="0 0 24 24"><g fill="#4cc2ff"><rect x="2" y="2" width="9.5" height="9.5" rx="1"/><rect x="12.5" y="2" width="9.5" height="9.5" rx="1"/>
    <rect x="2" y="12.5" width="9.5" height="9.5" rx="1"/><rect x="12.5" y="12.5" width="9.5" height="9.5" rx="1"/></g></svg></div>
  <div class="b"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg></div>
  <div class="b"><svg viewBox="0 0 24 24"><path d="M2 6.5A1.5 1.5 0 0 1 3.5 5H9l2 2h9.5A1.5 1.5 0 0 1 22 8.5V18a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 18Z" fill="#f4c542"/></svg></div>
  <div class="b" id="appBtn"><svg><use href="#bk"/></svg></div>
  <div id="tray">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="#fff"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 9h4l5-4v14l-5-4H3Z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
    <div id="clock"></div>
  </div>
</div>

<script>
const CFG = { VOLUME: 0.5, ROW_MS: 110 };   // ROW_MS: gap between rows as Binary Key reveals them
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const win = $('#win'), icon = $('#icon'), appBtn = $('#appBtn');

// ===== Sound: tiny synthesized ticks =====
const AC = new AudioContext(), master = AC.createGain();
master.gain.value = CFG.VOLUME; master.connect(AC.destination);
addEventListener('pointerdown', () => AC.resume());
function tone(type, f0, f1, dur, vol, delay = 0) {
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
}
const sfx = {
  open() { tone('sine', 420, 900, .18, .12); },
  tick() { tone('square', 2200, 1300, .05, .05); },
  done() { tone('sine', 1320, 0, .25, .1); tone('sine', 1760, 0, .35, .08, .08); },
  glitch() {
    const n = AC.createBufferSource(), b = AC.createBuffer(1, AC.sampleRate * .9, AC.sampleRate), d = b.getChannelData(0), g = AC.createGain();
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    n.buffer = b; g.gain.setValueAtTime(.3, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + .9);
    n.connect(g).connect(master); n.start();
    tone('sawtooth', 140, 35, .9, .2); tone('square', 2400, 180, .4, .06);
  },
};

// ===== Binary Key: the rows 0-9, revealed with a scan beam every time the app opens =====
$('#rows').innerHTML = Array.from({ length: 10 }, (_, d) =>
  `<div class="row"><span>${[...d.toString(2).padStart(4, '0')].map(b => `<i class="${b === '1' ? 'on' : ''}">0</i>`).join('')}</span><u>=</u><b>${d}</b></div>`).join('');
const rows = [...$('#rows').children];
let tok = 0;
async function lockRow(r, me) {                  // the bits scramble, then lock: lit cells flash and the digit pops
  r.classList.add('in');
  const cells = [...r.querySelectorAll('i')];
  for (let k = 0; k < 6; k++) { cells.forEach(c => c.textContent = Math.random() < .5 ? '0' : '1'); await wait(40); }
  if (me !== tok) return;
  cells.forEach(c => c.textContent = c.classList.contains('on') ? '1' : '0');
  r.classList.add('lock'); sfx.tick();
}
async function reveal() {
  const me = ++tok, list = $('#rows');
  rows.forEach(r => r.className = 'row');
  await wait(220);                               // the window finishes opening
  if (me !== tok) return;
  const y0 = list.offsetTop + 'px', y1 = list.offsetTop + list.offsetHeight + 'px';   // the beam reaches each row as it slides in
  $('#beam').animate([{ top: y0, opacity: 1 }, { top: y1, opacity: 1, offset: .92 }, { top: y1, opacity: 0 }], rows.length * CFG.ROW_MS / .92);
  for (const r of rows) {                        // not awaited: the rows overlap in a cascade
    if (me !== tok) return;
    lockRow(r, me); await wait(CFG.ROW_MS);
  }
  await wait(450);
  if (me === tok) sfx.done();
}

// ===== Stuck hint: projector.html sends it CFG.HINT_AFTER s into the run while the mask is still unclicked =====
let stuck = false;
function burst(ms) { const m = $('#motto'); m.classList.add('burst'); setTimeout(() => m.classList.remove('burst'), ms); }
async function stuckHint() {
  if (stuck) return;
  stuck = true;
  if (!win.hidden && !win.dataset.min) minimize();   // Aurora shoves Binary Key out of the way so the wallpaper shows
  document.body.classList.add('glitch'); burst(1300); sfx.glitch();
  await wait(550);
  $('#motto').classList.add('stuck');
  await wait(650);
  document.body.classList.remove('glitch');
  setInterval(() => burst(300), 5000);               // keeps twitching so it gets noticed
}

// ===== Window: open / minimize / maximize / close / drag, like Windows =====
function front(on) { appBtn.classList.toggle('front', on); }
function openWin() {
  if (!win.hidden) { if (win.dataset.min) restore(); return; }
  win.hidden = false; win.classList.remove('max'); delete win.dataset.min;
  win.style.left = (innerWidth - win.offsetWidth) / 2 + 'px';
  win.style.top = Math.max(0, (innerHeight - 48 - win.offsetHeight) / 2) + 'px';
  appBtn.classList.add('open'); front(true); sfx.open(); glow();
  hubWs?.readyState === 1 && hubWs.send(JSON.stringify({ t: 'evt', e: 'p1start' }));   // the run clock starts at the team's first click (this, or the mask)
  win.animate([{ transform: 'scale(.9)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 200, easing: 'cubic-bezier(.1,.9,.2,1)' });
  reveal();
}
function minimize() {
  win.dataset.min = 1; front(false);
  win.animate([{}, { transform: 'translateY(40vh) scale(.4)', opacity: 0 }], { duration: 180, easing: 'ease-in' }).finished
    .then(() => { if (win.dataset.min) win.style.visibility = 'hidden'; });
}
function restore() {
  delete win.dataset.min; win.style.visibility = ''; front(true);
  win.animate([{ transform: 'translateY(40vh) scale(.4)', opacity: 0 }, {}], { duration: 200, easing: 'cubic-bezier(.1,.9,.2,1)' });
}
function closeWin() {
  ++tok; appBtn.classList.remove('open');
  win.animate([{}, { transform: 'scale(.95)', opacity: 0 }], 120).finished.then(() => { win.hidden = true; win.style.visibility = ''; delete win.dataset.min; glow(); });
}
icon.addEventListener('click', openWin);            // one click opens it too: not everyone double-clicks
appBtn.addEventListener('click', () => win.dataset.min ? restore() : minimize());
$('.tbar').addEventListener('dblclick', () => win.classList.toggle('max'));
win.querySelectorAll('.tbar b').forEach(b => b.addEventListener('click', () => ({ min: minimize, max: () => win.classList.toggle('max'), close: closeWin })[b.dataset.a]()));
addEventListener('pointerdown', e => icon.classList.toggle('sel', !!e.target.closest('#icon')));
let drag = null;
$('.tbar').addEventListener('pointerdown', e => {
  if (e.target.closest('b') || win.classList.contains('max')) return;
  drag = { x: e.clientX - win.offsetLeft, y: e.clientY - win.offsetTop }; e.currentTarget.setPointerCapture(e.pointerId);
});
$('.tbar').addEventListener('pointermove', e => drag && Object.assign(win.style, {
  left: Math.min(innerWidth - 120, Math.max(120 - win.offsetWidth, e.clientX - drag.x)) + 'px',
  top: Math.min(innerHeight - 90, Math.max(0, e.clientY - drag.y)) + 'px' }));
$('.tbar').addEventListener('pointerup', () => drag = null);

const clock = () => $('#clock').innerHTML = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '<br>' + new Date().toLocaleDateString();
clock(); setInterval(clock, 5000);
addEventListener('contextmenu', e => e.preventDefault());   // no browser menu: it would give the fake away
addEventListener('dragstart', e => e.preventDefault());

// ===== Staff: Ctrl+Alt+R here reloads this screen. The projector's reset (its Ctrl+Alt+R or the GM panel's RESET)
// reaches this page through the hub, so one reset clears both screens =====
addEventListener('keydown', e => { if (e.ctrlKey && e.altKey && e.code === 'KeyR') { e.preventDefault(); location.reload(); } });
// ponytail: scans .1-.254 of one /24 network, enough for a booth router (same search as projector.html)
async function findHub() {
  const q = new URLSearchParams(location.search), net = q.get('net') || '192.168.0';
  if (q.get('hub')) return q.get('hub');
  const ping = (ip, ms) => fetch(`http://${ip}:3000/ping`, { signal: AbortSignal.timeout(ms) })
    .then(r => r.text()).then(t => t === 'nexus-hub' ? ip : Promise.reject());
  for (;;) {
    let saved; try { saved = localStorage.getItem('nexus-hub'); } catch {}
    const ip = await Promise.any(['localhost', saved].filter(Boolean).map(ip => ping(ip, 1000)))
      .catch(() => Promise.any(Array.from({ length: 254 }, (_, i) => ping(`${net}.${i + 1}`, 4000))))
      .catch(() => null);
    if (ip) { try { localStorage.setItem('nexus-hub', ip); } catch {} return ip; }
    await wait(2000);
  }
}
let hubWs;
// while Binary Key is open (minimized too), the mask on the wall glows as if hovered. Re-sent every 2 s, so a reloaded
// projector gets it again, and sent on connect, so a reset clears it
const glow = () => hubWs?.readyState === 1 && hubWs.send(JSON.stringify({ t: 'cmd', to: 'puzzle1', a: 'glow', v: +!win.hidden }));
setInterval(glow, 2000);
async function hub() {
  const ws = hubWs = new WebSocket('ws://' + await findHub() + ':3000/ws');
  ws.onopen = () => {
    ws.send(JSON.stringify({ t: 'hello', id: 'desk1', role: 'page' })); glow();
    if (window.TX) return;                       // from the hub, shared with the projector: the GM panel's INCOMING
    window.TX = 1;                               // TRANSMISSION, and the team's TIME LEFT
    for (const f of ['transmission.js', 'runclock.js']) {
      const s = document.createElement('script'); s.src = ws.url.replace(/^ws(.*)\/ws$/, `http$1/${f}?`) + Date.now(); s.dataset.room = 1;
      document.head.append(s);
    }
  };
  ws.onclose = () => setTimeout(hub, 2000);
  ws.onmessage = e => { const m = JSON.parse(e.data);
    if (m.t === 'cmd' && m.a === 'key' && m.v === 'KeyR') location.reload();
    if (m.t === 'cmd' && m.a === 'hint') stuckHint();
    if (m.t === 'cmd' && m.a === 'msg') window.transmit?.(m.v);
    if (m.t === 'run') window.RUN = m; };         // runclock.js reads it
}
hub();
</script>
</body>
</html>
